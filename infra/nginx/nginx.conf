# Nginx reverse proxy — config minima para p0infra.1
# Stack: nginx:1.27-alpine (ssl terminacion)  ->  3x backend:8000 (FastAPI)  ->  postgres
# Round-robin por default en Nginx (least_conn / ip_hash NO necesarios todavia).

upstream backend {
    server backend:8000;
    server backend:8000;
    server backend:8000;
}

# HTTP -> HTTPS (redireccion 301).
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS -> upstream.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;

    # Cert self-signed: protocolos seguros igual, pero no exigimos TLSv1.3-only porque
    # navegadores viejos en dev pueden renegociar.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        # Headers para que el backend vea el host real + IP del cliente + scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts razonables para APIs. Ajustar cuando llegue streaming/long-poll.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
