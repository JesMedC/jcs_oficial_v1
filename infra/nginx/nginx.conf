# Nginx reverse proxy — serves the public portal SPA from /usr/share/nginx/html
# (mounted from ./dist by docker-compose) and proxies API + health to the
# FastAPI backend on backend:8000.
#
# Layout:
#   /                → static portal (SPA index.html) with SPA fallback
#   /assets/*        → static assets (long cache)
#   /api/*           → backend FastAPI
#   /health, /health/ready → backend health probes
#   /favicon.svg, /og.png, /robots.txt, /sitemap.xml → static

upstream backend {
    server backend:8000;
    server backend:8000;
    server backend:8000;
}

# Map the requested host to the right root path so multi-domain works.
# For now both apex and www point at the same SPA.
map $host $site_root {
    default        /usr/share/nginx/html;
}

# HTTP -> HTTPS.
server {
    listen 80;
    server_name _;

    # ACME http-01 challenge (certbot) — handled by static /.well-known/.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # --- API + health → backend -----------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ ^/health(/.*)?$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # FastAPI docs / OpenAPI — proxy to backend.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Static assets (long cache) ------------------------------------
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- SPA fallback ---------------------------------------------------
    # Any GET request that doesn't match an existing file under root
    # falls back to /index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
