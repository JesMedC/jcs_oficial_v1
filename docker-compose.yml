# docker-compose raíz — orquesta postgres + backend (FastAPI) tras nginx.
# Levanta todo: `docker compose up -d`
# Solo backend + db: `docker compose up -d postgres backend`

services:
  postgres:
    image: postgres:16-alpine
    container_name: jcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jcs
      POSTGRES_PASSWORD: jcs
      POSTGRES_DB: jcs
    ports:
      - "5433:5432"  # 5433 evita colision con Postgres locales en 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcs -d jcs"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin container_name: Docker Compose autonombra `jcs-backend-1`, `-2`, `-3` con --scale.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://jcs:jcs@postgres:5432/jcs
      DATABASE_URL_SYNC: postgresql+psycopg2://jcs:jcs@postgres:5432/jcs
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-aaaa}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TTL_MIN: 15
      JWT_REFRESH_TTL_DAYS: 14
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://jadecapitalsuite.com,http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_URL: ${MERCADOPAGO_WEBHOOK_URL:-}
      # Google OAuth — p0auth.1. When all three are empty, the
      # ``/api/v1/auth/google/login`` endpoint returns 503 with the
      # canonical "Google login no esta configurado" envelope. Set
      # them to real values (see docs/google-oauth-setup.md) to
      # enable Google login.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    # expose (NO ports): backend NO se publica al host — solo Nginx puede llegar.
    # expose OR publish — tunnel talks to the host so publish :8000.
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload friendly: monta el código desde el host.
      - ./backend:/app
    command: ["bash", "entrypoint.sh"]
    # Healthcheck via Python (la imagen base `python:3.12-slim` no trae curl).
    # Cualquier HTTP no-200 hace raise HTTPError -> exit != 0 -> unhealthy.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: jcs-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./dist:/usr/share/nginx/html:ro

volumes:
  postgres_data:
    driver: local